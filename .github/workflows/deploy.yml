name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    environment: deploy environment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          printf '%s' "${{ secrets.ENV_FILE }}" > .env
          docker compose up -d --build
          rm -f .env
          docker image prune -f
